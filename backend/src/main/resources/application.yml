server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: saferoute-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/saferoute}
      auto-index-creation: false
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
saferoute:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  bootstrap-admin-email: ${SAFEROUTE_BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${SAFEROUTE_BOOTSTRAP_ADMIN_PASSWORD:}
  admin-reset-password: ${SAFEROUTE_ADMIN_RESET_PASSWORD:}
  jwt-secret: ${SAFEROUTE_JWT_SECRET:}
  jwt-ttl-minutes: ${SAFEROUTE_JWT_TTL_MINUTES:20}
